<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#0a0a0b"/>
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none"
    stroke="rgba(255,255,255,0.07)" stroke-width="2.5"/>

  <!-- Baseline -->
  <rect x="90" y="432" width="332" height="6" rx="3" fill="rgba(255,255,255,0.09)"/>

  <!-- Left bar (~52% height) -->
  <rect x="90" y="258" width="90" height="174" rx="22" fill="url(#gb)" opacity="0.42"/>

  <!-- Center bar (tallest ~80%, brightest, glowing) -->
  <rect x="211" y="160" width="90" height="272" rx="22" fill="url(#gb)" filter="url(#glow)"/>

  <!-- Right bar (~64% height) -->
  <rect x="332" y="218" width="90" height="214" rx="22" fill="url(#gb)" opacity="0.62"/>
</svg>
