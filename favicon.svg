<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="yg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="#0a0a0b"/>
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="508" height="508" rx="109" ry="109" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  <!-- Bold Y letterform -->
  <text x="256" y="370"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif"
    font-size="320"
    font-weight="800"
    text-anchor="middle"
    fill="url(#yg)"
    filter="url(#glow)"
    letter-spacing="-8">Y</text>
</svg>
