<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fokus</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0a0a0b;
  --surface: #111113;
  --border: rgba(255,255,255,0.07);
  --text: #FAFAFA;
  --text-secondary: rgba(255,255,255,0.55);
  --text-tertiary: rgba(255,255,255,0.3);
  --focus-color: #60a5fa;
  --break-color: #6ee7b7;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
body { display: flex; flex-direction: column; }

.page {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 20px calc(32px + env(safe-area-inset-bottom));
  gap: 28px;
  overflow-y: auto;
}

/* Phase badge */
.phase-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  transition: background 0.3s, color 0.3s;
}
.phase-badge.focus { background: rgba(96,165,250,0.12); color: var(--focus-color); }
.phase-badge.brk   { background: rgba(110,231,183,0.12); color: var(--break-color); }
.phase-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}

/* Ring */
.ring-wrap {
  position: relative;
  width: min(280px, 72vw);
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
}
.timer-ring {
  position: absolute; inset: 0;
  transform: rotate(-90deg);
  overflow: visible;
}
.ring-track {
  fill: none;
  stroke: rgba(255,255,255,0.06);
  stroke-width: 8;
}
.ring-progress {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s linear, stroke 0.3s;
}
.ring-center {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  position: relative; z-index: 1;
}
.timer-display {
  font-size: clamp(48px, 14vw, 72px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--text);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.timer-sub {
  font-size: 12px;
  color: var(--text-tertiary);
  letter-spacing: 0.06em;
}

/* Controls */
.controls {
  display: flex; align-items: center; gap: 16px;
}
.btn-start {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--focus-color);
  border: none; color: #050506;
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.3s, transform 0.1s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-start.brk { background: var(--break-color); }
.btn-start:active { transform: scale(0.93); }
.btn-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-icon:active { background: rgba(255,255,255,0.12); }

/* Session streak */
.session-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-secondary);
}
.session-dots {
  display: flex; gap: 5px;
}
.session-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(96,165,250,0.25);
  transition: background 0.2s;
}
.session-dot.done { background: var(--focus-color); }

/* Settings card */
.settings-card {
  width: 100%; max-width: 340px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  display: flex; flex-direction: column; gap: 0;
}
.settings-card-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
}
.setting-row + .setting-row {
  border-top: 1px solid var(--border);
}
.setting-label {
  font-size: 14px; color: var(--text);
}
.setting-sub {
  font-size: 11px; color: var(--text-tertiary);
}
.setting-stepper {
  display: flex; align-items: center; gap: 0;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.step-btn {
  width: 36px; height: 36px;
  background: none; border: none;
  color: var(--text);
  font-size: 18px; font-weight: 300;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.step-btn:active { background: rgba(255,255,255,0.1); }
.step-val {
  min-width: 38px;
  text-align: center;
  font-size: 15px; font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* Notification toggle */
.notif-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 0;
}
.toggle-wrap {
  width: 44px; height: 26px; border-radius: 13px;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--border);
  position: relative; cursor: pointer;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.toggle-wrap.on { background: var(--focus-color); border-color: var(--focus-color); }
.toggle-knob {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.toggle-wrap.on .toggle-knob { transform: translateX(18px); }
</style>
</head>
<body>
<script src="topbar.js" defer></script>

<div class="page">
  <!-- Phase badge -->
  <div class="phase-badge focus" id="phaseBadge">
    <span class="phase-dot"></span>
    <span id="phaseLabel">FOKUSZEIT</span>
  </div>

  <!-- Ring -->
  <div class="ring-wrap">
    <svg class="timer-ring" viewBox="0 0 200 200" id="timerRing">
      <circle class="ring-track" cx="100" cy="100" r="88"/>
      <circle class="ring-progress" cx="100" cy="100" r="88" id="ringProgress"
        stroke="#60a5fa"
        stroke-dasharray="553"
        stroke-dashoffset="0"/>
    </svg>
    <div class="ring-center">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-sub" id="timerSub">bereit</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-icon" id="resetBtn" title="Zurücksetzen">↺</button>
    <button class="btn-start focus" id="startBtn">▶</button>
    <button class="btn-icon" id="skipBtn" title="Überspringen">⏭</button>
  </div>

  <!-- Sessions -->
  <div class="session-row">
    <div class="session-dots" id="sessionDots">
      <div class="session-dot" id="sd0"></div>
      <div class="session-dot" id="sd1"></div>
      <div class="session-dot" id="sd2"></div>
      <div class="session-dot" id="sd3"></div>
    </div>
    <span id="sessionLabel">0 Sessions heute</span>
  </div>

  <!-- Settings -->
  <div class="settings-card">
    <div class="settings-card-title">Einstellungen</div>

    <div class="setting-row">
      <div>
        <div class="setting-label">Fokuszeit</div>
        <div class="setting-sub">Minuten</div>
      </div>
      <div class="setting-stepper">
        <button class="step-btn" id="workMinus">−</button>
        <span class="step-val" id="workVal">25</span>
        <button class="step-btn" id="workPlus">+</button>
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-label">Kurzpause</div>
        <div class="setting-sub">Minuten</div>
      </div>
      <div class="setting-stepper">
        <button class="step-btn" id="breakMinus">−</button>
        <span class="step-val" id="breakVal">5</span>
        <button class="step-btn" id="breakPlus">+</button>
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-label">Lange Pause</div>
        <div class="setting-sub">nach 4 Sessions</div>
      </div>
      <div class="setting-stepper">
        <button class="step-btn" id="longMinus">−</button>
        <span class="step-val" id="longVal">15</span>
        <button class="step-btn" id="longPlus">+</button>
      </div>
    </div>

    <div class="setting-row notif-row">
      <div>
        <div class="setting-label">Ton bei Ende</div>
        <div class="setting-sub">Akustisches Signal</div>
      </div>
      <div class="toggle-wrap" id="soundToggle">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

const CIRC = 2 * Math.PI * 88; // ≈ 553

// ── State ──
const s = loadSettings();
let workMin  = s.workMin  || 25;
let breakMin = s.breakMin || 5;
let longMin  = s.longMin  || 15;
let soundOn  = s.soundOn !== undefined ? s.soundOn : true;

let phase      = 'focus'; // 'focus' | 'break' | 'long'
let running    = false;
let timeLeft   = workMin * 60;
let totalTime  = workMin * 60;
let sessionsToday = loadSessions();
let interval   = null;

// ── Persist ──
function loadSettings() {
  try { return JSON.parse(localStorage.getItem('focus_settings_v1')) || {}; } catch(e) { return {}; }
}
function saveSettings() {
  try { localStorage.setItem('focus_settings_v1', JSON.stringify({ workMin, breakMin, longMin, soundOn })); } catch(e) {}
}
function todayKey() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadSessions() {
  try {
    const r = JSON.parse(localStorage.getItem('focus_sessions_v1'));
    if (r && r.date === todayKey()) return r.count || 0;
    return 0;
  } catch(e) { return 0; }
}
function saveSessions() {
  try { localStorage.setItem('focus_sessions_v1', JSON.stringify({ date: todayKey(), count: sessionsToday })); } catch(e) {}
}

// ── DOM refs ──
const display   = document.getElementById('timerDisplay');
const sub       = document.getElementById('timerSub');
const ring      = document.getElementById('ringProgress');
const startBtn  = document.getElementById('startBtn');
const resetBtn  = document.getElementById('resetBtn');
const skipBtn   = document.getElementById('skipBtn');
const badge     = document.getElementById('phaseBadge');
const phLabel   = document.getElementById('phaseLabel');
const sessLabel = document.getElementById('sessionLabel');
const workValEl = document.getElementById('workVal');
const breakValEl= document.getElementById('breakVal');
const longValEl = document.getElementById('longVal');
const soundTog  = document.getElementById('soundToggle');

// ── Render ──
function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function renderTimer() {
  display.textContent = fmt(timeLeft);
  const pct = totalTime > 0 ? timeLeft / totalTime : 1;
  ring.style.strokeDashoffset = CIRC * (1 - pct);
}

function renderPhase() {
  const isFocus = phase === 'focus';
  badge.className = 'phase-badge ' + (isFocus ? 'focus' : 'brk');
  ring.style.stroke = isFocus ? '#60a5fa' : '#6ee7b7';
  startBtn.className = 'btn-start ' + (isFocus ? 'focus' : 'brk');
  if (phase === 'focus') {
    phLabel.textContent = 'FOKUSZEIT';
    sub.textContent = running ? 'fokussiert' : 'bereit';
  } else if (phase === 'break') {
    phLabel.textContent = 'KURZPAUSE';
    sub.textContent = running ? 'erholen' : 'bereit';
  } else {
    phLabel.textContent = 'LANGE PAUSE';
    sub.textContent = running ? 'gut verdient' : 'bereit';
  }
}

function renderSessions() {
  sessLabel.textContent = sessionsToday + ' Session' + (sessionsToday !== 1 ? 's' : '') + ' heute';
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('sd' + i);
    if (dot) dot.classList.toggle('done', i < (sessionsToday % 4 || (sessionsToday > 0 && sessionsToday % 4 === 0 ? 4 : 0)));
  }
}

function renderSettings() {
  workValEl.textContent  = workMin;
  breakValEl.textContent = breakMin;
  longValEl.textContent  = longMin;
  soundTog.classList.toggle('on', soundOn);
}

function renderAll() {
  renderTimer();
  renderPhase();
  renderSessions();
  renderSettings();
  startBtn.textContent = running ? '⏸' : '▶';
}

// ── Timer logic ──
function tick() {
  if (timeLeft <= 0) {
    phaseComplete();
    return;
  }
  timeLeft--;
  renderTimer();
}

function phaseComplete() {
  stop();
  playBeep();

  if (phase === 'focus') {
    sessionsToday++;
    saveSessions();
    renderSessions();
    const isLong = sessionsToday % 4 === 0;
    startPhase(isLong ? 'long' : 'break');
  } else {
    startPhase('focus');
  }
}

function startPhase(ph) {
  phase = ph;
  if (ph === 'focus')       { timeLeft = totalTime = workMin * 60; }
  else if (ph === 'break')  { timeLeft = totalTime = breakMin * 60; }
  else                      { timeLeft = totalTime = longMin * 60; }
  renderAll();
}

function start() {
  if (running) return;
  running = true;
  sub.textContent = phase === 'focus' ? 'fokussiert' : 'erholen';
  startBtn.textContent = '⏸';
  interval = setInterval(tick, 1000);
}

function stop() {
  running = false;
  clearInterval(interval);
  startBtn.textContent = '▶';
}

function reset() {
  stop();
  startPhase(phase);
}

function skip() {
  stop();
  if (phase === 'focus') {
    sessionsToday++;
    saveSessions();
    renderSessions();
    const isLong = sessionsToday % 4 === 0;
    startPhase(isLong ? 'long' : 'break');
  } else {
    startPhase('focus');
  }
}

// ── Sound ──
function playBeep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.15, 0.3].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = i === 1 ? 880 : 660;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.18, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.3);
    });
  } catch(e) {}
}

// ── Event listeners ──
startBtn.addEventListener('click', () => { if (running) stop(); else start(); });
resetBtn.addEventListener('click', reset);
skipBtn.addEventListener('click', skip);

function makeStepper(minusId, plusId, getVal, setVal, min, max) {
  document.getElementById(minusId).addEventListener('click', () => {
    if (getVal() <= min) return;
    setVal(getVal() - 1);
    saveSettings(); renderSettings();
    if (!running) startPhase(phase);
  });
  document.getElementById(plusId).addEventListener('click', () => {
    if (getVal() >= max) return;
    setVal(getVal() + 1);
    saveSettings(); renderSettings();
    if (!running) startPhase(phase);
  });
}

makeStepper('workMinus','workPlus',  ()=>workMin,  v=>{ workMin=v; },  1, 90);
makeStepper('breakMinus','breakPlus',()=>breakMin, v=>{ breakMin=v; }, 1, 30);
makeStepper('longMinus','longPlus',  ()=>longMin,  v=>{ longMin=v; },  5, 60);

soundTog.addEventListener('click', () => {
  soundOn = !soundOn;
  saveSettings(); renderSettings();
});

// ── Init ──
startPhase('focus');
})();
</script>
</body>
</html>
